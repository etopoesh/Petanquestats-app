name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npm install -D @tailwindcss/postcss
          npm install @capacitor/filesystem @capacitor/share

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform and Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Install Capacitor Assets Generator
        run: npm install -D @capacitor/assets

      - name: Generate App Icons
        run: npx capacitor-assets generate --android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Номер бета-версии = порядковый номер запуска workflow в GitHub Actions.
      # Растёт сам с каждым пушем, ничего вручную поддерживать не нужно.
      - name: Rename APK with beta version
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/Petanque-Stats-beta-${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petanque-Stats-beta-${{ github.run_number }}
          path: release/Petanque-Stats-beta-${{ github.run_number }}.apk
